<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Detail — Gavel</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="images/logo.png">
  <style>
    .detail-page { padding: var(--space-8) 0 var(--space-16); }
    .detail-breadcrumb { display:flex; gap:8px; flex-wrap:wrap; color:var(--text-muted); font-size:var(--text-sm); margin-bottom:var(--space-5); }
    .detail-main { display:grid; grid-template-columns:minmax(0,1.02fr) minmax(340px,0.98fr); gap:var(--space-8); align-items:start; }
    .gallery-shell, .purchase-shell, .content-shell, .history-shell { background:var(--bg-raised); border:1px solid var(--border-light); border-radius:var(--radius-2xl); box-shadow:var(--shadow-sm); }
    .gallery-shell { padding:var(--space-5); }
    .gallery-layout { display:grid; grid-template-columns:92px minmax(0,1fr) 220px; gap:var(--space-4); align-items:start; }
    .thumbs-rail { display:flex; flex-direction:column; gap:var(--space-3); max-height:640px; overflow:auto; }
    .thumb-card { border:1px solid var(--border-light); background:var(--parchment); border-radius:18px; width:92px; height:92px; overflow:hidden; cursor:pointer; position:relative; transition:all var(--transition); }
    .thumb-card.active { border-color:var(--olive); box-shadow:0 0 0 2px rgba(92,107,79,0.12); }
    .thumb-card img, .thumb-card video { width:100%; height:100%; object-fit:cover; display:block; }
    .thumb-play { position:absolute; right:8px; bottom:8px; width:24px; height:24px; border-radius:50%; background:rgba(44,36,23,0.74); color:var(--parchment); display:grid; place-items:center; font-size:11px; }
    .stage-wrap { display:grid; grid-template-columns:minmax(0,1fr); gap:var(--space-4); }
    .main-stage { position:relative; background:linear-gradient(180deg,#f9f6f0 0%,#efe7da 100%); border-radius:26px; min-height:560px; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--border-light); cursor:crosshair; }
    .main-stage img, .main-stage video { width:100%; height:100%; max-height:640px; object-fit:contain; display:block; }
    .stage-note { position:absolute; left:18px; bottom:18px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,0.8); backdrop-filter:blur(8px); color:var(--text-secondary); font-size:var(--text-xs); font-weight:600; }
    .zoom-panel { background:#fff; border:1px solid var(--border-light); border-radius:24px; min-height:560px; display:none; background-repeat:no-repeat; background-size:220%; box-shadow:var(--shadow-md); }
    .zoom-panel.active { display:block; }
    .lightbox-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:320; padding:24px; }
    .lightbox-backdrop.open { display:flex; }
    .lightbox-content { width:min(1100px, 100%); height:min(85vh, 820px); border-radius:24px; overflow:hidden; background:#111; position:relative; display:flex; align-items:center; justify-content:center; }
    .lightbox-content img, .lightbox-content video { width:100%; height:100%; object-fit:contain; }
    .lightbox-close { position:absolute; top:16px; right:16px; z-index:2; width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,0.14); color:#fff; font-size:20px; cursor:pointer; }
    .purchase-shell { padding:var(--space-6); position:sticky; top:calc(var(--space-20) + var(--space-4)); }
    .badge-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:var(--space-4); }
    .amazon-badge { display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; font-size:var(--text-xs); font-weight:700; letter-spacing:0.03em; background:var(--sand); color:var(--earth-dark); }
    .amazon-badge.live { background:rgba(92,107,79,0.14); color:var(--olive-dark); }
    .headline { font-size:clamp(2rem,3vw,2.8rem); line-height:1.05; margin-bottom:var(--space-4); }
    .purchase-card { background:var(--parchment); border:1px solid var(--border-light); border-radius:24px; padding:var(--space-5); margin-bottom:var(--space-5); }
    .purchase-grid { display:grid; grid-template-columns:1fr auto; gap:var(--space-3); align-items:end; }
    .price-label { font-size:var(--text-sm); color:var(--text-muted); margin-bottom:4px; }
    .price-value { font-family:var(--font-heading); font-size:clamp(2.2rem,3vw,3.2rem); line-height:1; }
    .countdown-pill { display:inline-flex; align-items:center; gap:8px; border-radius:999px; padding:8px 14px; background:#fff; border:1px solid var(--border-light); font-size:var(--text-sm); font-weight:700; }
    .countdown-pill.urgent { color:var(--ember); border-color:rgba(196,93,62,0.25); background:rgba(196,93,62,0.08); }
    .meta-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); margin-top:var(--space-4); }
    .meta-block { background:#fff; border:1px solid var(--border-light); border-radius:18px; padding:14px 16px; }
    .meta-block strong { display:block; font-size:var(--text-xs); letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; }
    .meta-block span { color:var(--text-primary); font-weight:600; }
    .action-stack { display:flex; flex-direction:column; gap:var(--space-4); }
    .inline-note { color:var(--text-secondary); font-size:var(--text-sm); line-height:1.6; }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .toggle-switch { position:relative; display:inline-flex; width:52px; height:30px; }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider {
      position:absolute; inset:0; border-radius:999px; background:var(--sand);
      border:1px solid var(--border); transition:all var(--transition); cursor:pointer;
    }
    .toggle-slider::before {
      content:''; position:absolute; width:22px; height:22px; border-radius:50%;
      background:#fff; top:3px; left:3px; box-shadow:var(--shadow-sm); transition:transform var(--transition);
    }
    .toggle-switch input:checked + .toggle-slider { background:rgba(92,107,79,0.2); border-color:var(--olive); }
    .toggle-switch input:checked + .toggle-slider::before { transform:translateX(22px); }
    .autobid-panel { background:var(--bg); border:1px solid var(--border-light); border-radius:20px; padding:var(--space-4); }
    .seller-card { margin-top:var(--space-5); background:var(--bg); border:1px solid var(--border-light); border-radius:20px; padding:var(--space-4); }
    .seller-links { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
    .seller-links button { padding:0; border:none; background:none; color:var(--olive); font-size:var(--text-sm); cursor:pointer; }
    .content-shell { padding:var(--space-6); margin-top:var(--space-8); }
    .content-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,0.9fr); gap:var(--space-8); }
    .section-heading { font-size:var(--text-2xl); margin-bottom:var(--space-4); }
    .description-copy { white-space:pre-wrap; line-height:1.8; color:var(--text-secondary); }
    .spec-table { width:100%; border-collapse:collapse; }
    .spec-table td { padding:12px 0; border-bottom:1px solid var(--border-light); vertical-align:top; }
    .spec-table td:first-child { width:180px; color:var(--text-muted); font-weight:700; }
    .history-shell { padding:var(--space-6); margin-top:var(--space-8); }
    .history-top { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); margin-bottom:var(--space-4); }
    .history-chart { width:100%; height:220px; background:linear-gradient(180deg,#faf7f2 0%,#f2ecdf 100%); border:1px solid var(--border-light); border-radius:24px; margin-bottom:var(--space-5); }
    .history-list { display:flex; flex-direction:column; }
    .history-row { display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:var(--space-4); align-items:center; padding:16px 0; border-bottom:1px solid var(--border-light); }
    .history-avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,var(--olive),var(--sage)); color:var(--parchment); display:grid; place-items:center; font-weight:700; }
    .history-name { font-weight:700; }
    .history-time { color:var(--text-muted); font-size:var(--text-xs); margin-top:4px; }
    .history-empty { padding:42px 20px; text-align:center; color:var(--text-muted); background:var(--bg); border:1px dashed var(--border); border-radius:20px; }
    .winner-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:var(--space-5); }
    @media (max-width: 1180px) {
      .detail-main { grid-template-columns:1fr; }
      .purchase-shell { position:static; }
      .gallery-layout { grid-template-columns:1fr; }
      .thumbs-rail { order:2; flex-direction:row; }
      .zoom-panel { min-height:260px; }
    }
    @media (max-width: 820px) {
      .content-grid { grid-template-columns:1fr; }
      .main-stage { min-height:420px; }
      .purchase-grid, .meta-row { grid-template-columns:1fr; }
      .history-row { grid-template-columns:40px minmax(0,1fr); }
      .history-row .price { grid-column:2; }
    }
  </style>
</head>
<body style="padding-top:var(--space-20);">
  <nav class="navbar" id="navbar"><div class="container">
    <a href="/" class="navbar-brand">Gavel<span>.</span></a>
    <ul class="navbar-nav">
      <li><a href="auction.html">Live Auctions</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="sell-product.html">Sell</a></li>
      <li><a href="chats.html">Messages</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="login.html" class="btn btn-ghost btn-sm" id="loginBtn">Log in</a>
      <a href="signup.html" class="btn btn-primary btn-sm" id="signupBtn">Get Started</a>
      <a href="dashboard.html" class="btn btn-primary btn-sm hide" id="dashboardBtn">Dashboard</a>
    </div>
  </div></nav>

  <main class="detail-page">
    <div class="container">
      <div id="detailContent" class="flex-center" style="min-height:560px;"><div class="spinner"></div></div>
    </div>
  </main>

  <footer style="border-top:1px solid var(--border-light);padding:var(--space-8) 0;background:var(--bg);">
    <div class="container flex-between" style="gap:var(--space-4);">
      <a href="/" class="navbar-brand">Gavel<span>.</span></a>
      <p class="text-muted text-sm">&copy; 2026 Gavel · <a href="/admin-handbook.html">Become an Admin</a></p>
    </div>
  </footer>
  <div class="toast-container" id="toastContainer"></div>
  <div class="lightbox-backdrop" id="mediaLightbox">
    <div class="lightbox-content" id="lightboxContent"></div>
    <button class="lightbox-close" type="button" onclick="closeLightbox()">&times;</button>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let auction = null;
    let media = [];
    let currentMediaIndex = 0;
    let ws = null;
    let countdownInterval = null;
    let activeAutoBid = null;
    let currentViewer = null;

    document.addEventListener('DOMContentLoaded', async function() {
      await Auth.init();
      currentViewer = Auth.getUser();
      window.addEventListener('scroll', function() {
        document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 20);
      });

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = '/auction.html';
        return;
      }

      const data = await api.get('/auction/' + id);
      if (!data || data.message) {
        renderErrorState('Item not found.');
        return;
      }

      auction = data;
      media = buildMedia(auction);
      renderDetail();
      await loadAutoBidState();
      await loadBidHistory();
      connectWS();
    });

    function buildMedia(item) {
      const images = Array.isArray(item.images) ? item.images.filter(Boolean) : [];
      const list = images.map(function(src) { return { type: 'image', src: src }; });
      if (item.video) list.push({ type: 'video', src: item.video });
      if (!list.length) list.push({ type: 'placeholder', src: '' });
      return list;
    }

    function renderDetail() {
      const target = document.getElementById('detailContent');
      const specs = UI.normalizeSpecifications(auction.specifications);
      const current = media[currentMediaIndex] || media[0];
      const minBid = Number(auction.currentBid || 0) + Number(auction.increment || 1);
      const isClosed = auction.status === 'closed';
      const isWinner = currentViewer && auction.winnerEmail && currentViewer.email === auction.winnerEmail;
      const isSeller = currentViewer && currentViewer.email === auction.sellerEmail;
      const currentCondition = getCondition();

      target.innerHTML = `
        <div class="detail-breadcrumb">
          <span>Home</span><span>/</span><span>${escapeHtml(auction.category || 'Marketplace')}</span><span>/</span><span>${escapeHtml(auction.title)}</span>
        </div>

        <div class="detail-main">
          <section class="gallery-shell">
            <div class="gallery-layout">
              <div class="thumbs-rail">
                ${media.map(function(entry, index) {
                  return `<button type="button" class="thumb-card${index === currentMediaIndex ? ' active' : ''}" onclick="switchMedia(${index})">
                    ${entry.type === 'video'
                      ? `<video src="${entry.src}" muted playsinline preload="metadata"></video><span class="thumb-play">▶</span>`
                      : entry.type === 'image'
                        ? `<img src="${entry.src}" alt="Thumbnail ${index + 1}">`
                        : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--sand);color:var(--earth);font-size:12px;">No media</div>`
                    }
                  </button>`;
                }).join('')}
              </div>

              <div class="stage-wrap">
                <div class="main-stage" id="mainStage" onclick="openLightbox()">
                  ${current.type === 'video'
                    ? `<video id="mainMediaVideo" controls playsinline src="${current.src}"></video>`
                    : current.type === 'image'
                      ? `<img id="mainMediaImage" src="${current.src}" alt="${escapeHtml(auction.title)}">`
                      : `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--earth);font-family:var(--font-heading);font-size:var(--text-xl);">No media uploaded</div>`
                  }
                  <div class="stage-note">${current.type === 'video' ? 'Click to see full view' : 'Hover to zoom · Click to see full view'}</div>
                </div>
              </div>

              <div class="zoom-panel${current.type === 'image' ? ' active' : ''}" id="zoomPanel"></div>
            </div>
          </section>

          <aside class="purchase-shell">
            <div class="badge-row">
              <span class="amazon-badge live">${escapeHtml(String(auction.status || 'ACTIVE').toUpperCase())}</span>
              <span class="amazon-badge">${escapeHtml(auction.category || 'General')}</span>
              <span class="amazon-badge">${escapeHtml(currentCondition)}</span>
            </div>

            <h1 class="headline">${escapeHtml(auction.title)}</h1>

            <div class="purchase-card">
              <div class="purchase-grid">
                <div>
                  <div class="price-label">Current Bid</div>
                  <div class="price-value" id="currentBidDisplay">${UI.formatPrice(auction.currentBid)}</div>
                </div>
                <div class="countdown-pill${UI.isUrgent(auction.endTime) ? ' urgent' : ''}" id="timerDisplay">${UI.formatTime(auction.endTime)}</div>
              </div>
              <div class="meta-row">
                <div class="meta-block">
                  <strong>Increment</strong>
                  <span>${UI.formatPrice(auction.increment || 0)}</span>
                </div>
                <div class="meta-block">
                  <strong>Bid Count</strong>
                  <span>${Number(auction.bidCount || 0).toLocaleString('en-IN')} bids</span>
                </div>
              </div>
            </div>

            <div class="action-stack">
              ${isClosed
                ? `<div class="purchase-card">
                    <div class="price-label">Auction Status</div>
                    <div style="font-weight:700;font-size:var(--text-lg);margin-bottom:12px;">${auction.winnerName ? 'Closed with a winner' : 'Closed with no bids'}</div>
                    ${auction.winnerName ? `<div class="inline-note">Winner: ${escapeHtml(auction.winnerName)} at ${UI.formatPrice(auction.winningBid || auction.currentBid)}</div>` : `<div class="inline-note">No winning bidder was recorded for this listing.</div>`}
                    <div class="winner-actions">
                      ${isWinner ? `<a class="btn btn-primary" href="/winner-confirmation.html?id=${auction.id}">You Won</a>` : ''}
                      ${(isWinner || isSeller) ? `<a class="btn btn-secondary" href="/receipt.html?id=${auction.id}">Receipt</a>` : ''}
                      ${(isWinner || isSeller) ? `<a class="btn btn-ghost" href="/chat.html?auction=${auction.id}&with=${encodeURIComponent(isWinner ? auction.sellerEmail : auction.winnerEmail || '')}">Open Chat</a>` : ''}
                    </div>
                  </div>`
                : `<div class="purchase-card">
                    <div class="form-group">
                      <label class="form-label">Your Bid</label>
                      <input class="form-input" type="number" id="bidAmount" min="${minBid}" step="${auction.increment || 1}" value="${minBid}">
                    </div>
                    <button class="btn btn-primary btn-lg" style="width:100%;" onclick="confirmAndPlaceBid()">Place Bid</button>
                  </div>`
              }

              ${!isClosed ? `
                <div class="autobid-panel">
                  <div class="toggle-row">
                    <div>
                      <strong>Auto-Bid</strong>
                      <div class="inline-note">Set your ceiling and let Gavel bid only as needed.</div>
                    </div>
                    <label class="toggle-switch">
                      <input type="checkbox" id="autoBidToggle" onchange="toggleAutoBidPanel()">
                      <span class="toggle-slider"></span>
                    </label>
                  </div>
                  <div id="autoBidPanel" style="display:none;margin-top:16px;">
                    <div class="form-group">
                      <label class="form-label">Maximum bid amount</label>
                      <input class="form-input" type="number" id="autoBidCeiling" min="${minBid}" placeholder="${minBid}">
                    </div>
                    <div class="inline-note" style="margin-bottom:12px;">You will be charged only if you win.</div>
                    <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="confirmAndSetAutoBid()">Set Auto-Bid</button>
                  </div>
                  <div id="autoBidStatus" class="inline-note" style="margin-top:14px;"></div>
                </div>` : ''}

              <div class="seller-card">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                  <div>
                    <div class="price-label">Seller</div>
                    <div style="font-weight:700;font-size:var(--text-lg);">${escapeHtml(auction.sellerName || 'Unknown')}</div>
                  </div>
                  <a class="btn btn-ghost btn-sm" href="/chat.html?auction=${auction.id}&with=${encodeURIComponent(auction.sellerEmail || '')}">Message</a>
                </div>
                <div class="inline-note" style="margin-top:12px;">Trust score: ${Number(auction.sellerTrustScore || 0)}</div>
                <div class="inline-note">Usually replies in 2 hours</div>
                <div class="seller-links">
                  <button type="button" onclick="reportListing()">Report listing</button>
                  <button type="button" onclick="blockSeller()">Block seller</button>
                </div>
              </div>
            </div>
          </aside>
        </div>

        <section class="content-shell">
          <div class="content-grid">
            <div>
              <h2 class="section-heading">Description</h2>
              <div class="description-copy">${escapeHtml(auction.description || 'No description provided.')}</div>
            </div>
            <div>
              <h2 class="section-heading">Specifications</h2>
              ${specs.length
                ? `<table class="spec-table">${specs.map(function(entry) { return `<tr><td>${escapeHtml(entry[0])}</td><td>${escapeHtml(entry[1])}</td></tr>`; }).join('')}</table>`
                : `<div class="history-empty">No specifications were provided for this item.</div>`
              }
            </div>
          </div>
        </section>

        <section class="history-shell">
          <div class="history-top">
            <div>
              <h2 class="section-heading" style="margin-bottom:4px;">Bid History</h2>
              <div class="inline-note">Track the full bidding curve and every participant in chronological order.</div>
            </div>
          </div>
          <canvas id="bidHistoryChart" class="history-chart"></canvas>
          <div id="bidHistory"></div>
        </section>
      `;

      initZoom();
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(updateCountdown, 1000);
      updateCountdown();
    }

    function renderErrorState(message) {
      document.getElementById('detailContent').innerHTML = `<div class="empty-state"><h3>${escapeHtml(message)}</h3><p><a href="/auction.html">Browse auctions</a></p></div>`;
    }

    function getCondition() {
      const specs = auction.specifications || {};
      return specs.Condition || specs.condition || auction.condition || 'Mint';
    }

    function switchMedia(index) {
      currentMediaIndex = index;
      renderDetail();
      loadAutoBidState();
      loadBidHistory();
    }

    function updateCountdown() {
      const el = document.getElementById('timerDisplay');
      if (!el) return;
      el.textContent = UI.formatTime(auction.endTime);
      el.className = 'countdown-pill' + (UI.isUrgent(auction.endTime) ? ' urgent' : '');
    }

    function initZoom() {
      const stage = document.getElementById('mainStage');
      const image = document.getElementById('mainMediaImage');
      const zoomPanel = document.getElementById('zoomPanel');
      if (!stage || !image || !zoomPanel) return;
      zoomPanel.style.backgroundImage = `url("${image.src}")`;
      stage.addEventListener('mousemove', function(event) {
        const rect = stage.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        zoomPanel.classList.add('active');
        zoomPanel.style.backgroundPosition = `${x}% ${y}%`;
      });
      stage.addEventListener('mouseleave', function() {
        zoomPanel.classList.remove('active');
      });
    }

    function openLightbox() {
      const current = media[currentMediaIndex] || media[0];
      const content = document.getElementById('lightboxContent');
      if (!current || !content) return;
      content.innerHTML = current.type === 'video'
        ? `<video src="${current.src}" controls autoplay playsinline></video>`
        : current.type === 'image'
          ? `<img src="${current.src}" alt="${escapeHtml(auction.title)}">`
          : `<div style="color:#fff;">No media</div>`;
      document.getElementById('mediaLightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('mediaLightbox').classList.remove('open');
      document.getElementById('lightboxContent').innerHTML = '';
    }

    async function loadBidHistory() {
      const holder = document.getElementById('bidHistory');
      if (!holder) return;
      holder.innerHTML = '<div class="spinner"></div>';
      const response = await api.get('/bids/' + auction.id);
      const bids = response && response.bids ? response.bids : [];
      drawBidHistoryChart(bids);
      if (!bids.length) {
        holder.innerHTML = '<div class="history-empty">Be the first to bid!</div>';
        return;
      }
      holder.innerHTML = '<div class="history-list">' + bids.map(function(bid) {
        const name = bid.bidderName || bid.maskedName || 'Bidder';
        const initials = name.split(' ').map(function(part) { return part.charAt(0); }).join('').slice(0, 2).toUpperCase();
        return `<div class="history-row">
          <div class="history-avatar">${escapeHtml(initials)}</div>
          <div>
            <div class="history-name">${escapeHtml(name)}</div>
            <div class="history-time">${escapeHtml(relativeTime(bid.placedAt))}</div>
          </div>
          <div class="price price-small">${UI.formatPrice(bid.amount)}</div>
        </div>`;
      }).join('') + '</div>';
    }

    function drawBidHistoryChart(bids) {
      const canvas = document.getElementById('bidHistoryChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const ratio = window.devicePixelRatio || 1;
      const displayWidth = canvas.clientWidth || 900;
      const displayHeight = 220;
      canvas.width = displayWidth * ratio;
      canvas.height = displayHeight * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, displayWidth, displayHeight);

      const padX = 34;
      const padY = 26;
      ctx.strokeStyle = '#d4c9b5';
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i += 1) {
        const y = padY + ((displayHeight - padY * 2) / 3) * i;
        ctx.beginPath();
        ctx.moveTo(padX, y);
        ctx.lineTo(displayWidth - padX, y);
        ctx.stroke();
      }

      if (!bids.length) {
        ctx.fillStyle = '#7a6e5e';
        ctx.font = '15px sans-serif';
        ctx.fillText('No bid activity yet.', padX, displayHeight / 2);
        return;
      }

      const values = bids.slice().reverse().map(function(entry) { return Number(entry.amount || 0); });
      const min = Math.min.apply(null, values);
      const max = Math.max.apply(null, values);
      const points = values.map(function(value, index) {
        return {
          x: padX + ((displayWidth - padX * 2) / Math.max(values.length - 1, 1)) * index,
          y: padY + (displayHeight - padY * 2) - ((value - min) / Math.max(max - min, 1)) * (displayHeight - padY * 2)
        };
      });

      const gradient = ctx.createLinearGradient(0, padY, 0, displayHeight - padY);
      gradient.addColorStop(0, 'rgba(92,107,79,0.22)');
      gradient.addColorStop(1, 'rgba(92,107,79,0)');
      ctx.beginPath();
      ctx.moveTo(points[0].x, displayHeight - padY);
      points.forEach(function(point) { ctx.lineTo(point.x, point.y); });
      ctx.lineTo(points[points.length - 1].x, displayHeight - padY);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.beginPath();
      points.forEach(function(point, index) {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.strokeStyle = '#5c6b4f';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#5c6b4f';
      points.forEach(function(point) {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    async function loadAutoBidState() {
      if (!Auth.isLoggedIn()) return;
      activeAutoBid = await api.get('/bids/auto-bid/' + auction.id);
      const status = document.getElementById('autoBidStatus');
      if (!status) return;
      if (activeAutoBid && activeAutoBid.active) {
        status.innerHTML = `Your auto-bid is active up to ${UI.formatPrice(activeAutoBid.ceiling)} <button type="button" class="btn btn-ghost btn-sm" onclick="cancelAutoBid()">Cancel</button>`;
      } else {
        status.textContent = 'No auto-bid active for this product.';
      }
    }

    function toggleAutoBidPanel() {
      const panel = document.getElementById('autoBidPanel');
      if (panel) panel.style.display = document.getElementById('autoBidToggle').checked ? 'block' : 'none';
    }

    async function confirmAndPlaceBid() {
      if (!Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return;
      }
      const amount = Number(document.getElementById('bidAmount').value);
      const confirmed = await confirmAction(`You are placing a bid of ${UI.formatPrice(amount)} on ${auction.title}. If you win, you will be charged ${UI.formatPrice(amount)}.`);
      if (!confirmed) return;
      const res = await api.post('/bids/' + auction.id, { bidAmount: amount });
      if (res && res.success) {
        UI.toast(res.message || 'Bid placed', 'success');
        auction.currentBid = res.newBid;
        auction.bidCount = res.bidCount;
        renderDetail();
        await loadAutoBidState();
        await loadBidHistory();
      } else {
        UI.toast(res && res.message ? res.message : 'Bid failed', 'error');
      }
    }

    async function confirmAndSetAutoBid() {
      if (!Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return;
      }
      const ceiling = Number(document.getElementById('autoBidCeiling').value);
      const confirmed = await confirmAction(`You are setting auto-bid up to ${UI.formatPrice(ceiling)} on ${auction.title}. You will be charged only if you win.`);
      if (!confirmed) return;
      const res = await api.post('/bids/auto-bid', { auctionId: auction.id, ceiling: ceiling });
      if (res && res.success) {
        UI.toast('Auto-bid saved', 'success');
        loadAutoBidState();
      } else {
        UI.toast(res && res.message ? res.message : 'Auto-bid failed', 'error');
      }
    }

    async function cancelAutoBid() {
      const res = await fetch('/api/bids/auto-bid/' + encodeURIComponent(auction.id), { method: 'DELETE', credentials: 'include' });
      const data = await res.json().catch(function() { return {}; });
      if (!res.ok) {
        UI.toast(data.message || 'Could not cancel auto-bid', 'error');
        return;
      }
      UI.toast('Auto-bid cancelled', 'info');
      loadAutoBidState();
    }

    function confirmAction(message) {
      return new Promise(function(resolve) {
        const modal = UI.showModal(`
          <h3 style="margin-bottom:12px;">Confirm Action</h3>
          <p style="color:var(--text-secondary);line-height:1.7;">${escapeHtml(message)}</p>
          <div style="display:flex;gap:12px;margin-top:18px;">
            <button class="btn btn-ghost" style="flex:1;" id="confirmCancelBtn">Cancel</button>
            <button class="btn btn-primary" style="flex:1;" id="confirmOkBtn">Confirm</button>
          </div>
        `);
        modal.querySelector('#confirmCancelBtn').addEventListener('click', function() { UI.closeModal(); resolve(false); });
        modal.querySelector('#confirmOkBtn').addEventListener('click', function() { UI.closeModal(); resolve(true); });
      });
    }

    function connectWS() {
      const token = document.cookie.split(';').map(function(entry) { return entry.trim(); }).find(function(entry) { return entry.indexOf('jwt_token=') === 0; });
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(protocol + '://' + window.location.host + '/ws?token=' + encodeURIComponent(token ? token.split('=')[1] : ''));
      ws.addEventListener('open', function() {
        ws.send(JSON.stringify({ type: 'watch', itemId: auction.id }));
      });
      ws.addEventListener('message', function(event) {
        const msg = JSON.parse(event.data);
        if (msg.type === 'bid_update') {
          auction.currentBid = msg.newBid;
          auction.bidCount = msg.bidCount;
          const currentBidDisplay = document.getElementById('currentBidDisplay');
          if (currentBidDisplay) currentBidDisplay.textContent = UI.formatPrice(msg.newBid);
          const bidInput = document.getElementById('bidAmount');
          if (bidInput) {
            bidInput.min = Number(msg.newBid) + Number(auction.increment || 1);
            bidInput.value = Number(msg.newBid) + Number(auction.increment || 1);
          }
          loadBidHistory();
        }
        if (msg.type === 'auction_closed') {
          auction.status = 'closed';
          auction.winnerEmail = msg.winnerEmail;
          auction.winnerName = msg.winnerName;
          auction.winningBid = msg.winningBid;
          renderDetail();
          loadBidHistory();
        }
        if (msg.type === 'outbid' && Array.isArray(msg.outbidEmails) && currentViewer && msg.outbidEmails.indexOf(currentViewer.email) !== -1 && activeAutoBid && activeAutoBid.active) {
          UI.toast(`You've been outbid — your max of ${UI.formatPrice(activeAutoBid.ceiling)} was exceeded`, 'error');
          Auth.notify('Outbid on ' + auction.title, `Your max of ${UI.formatPrice(activeAutoBid.ceiling)} was exceeded.`);
        }
      });
    }

    function reportListing() {
      UI.showModal(`
        <h3 style="margin-bottom:12px;">Report Listing</h3>
        <div style="display:grid;gap:8px;">
          <button class="btn btn-ghost" onclick="submitReport('fake')">Fake</button>
          <button class="btn btn-ghost" onclick="submitReport('wrong description')">Wrong description</button>
          <button class="btn btn-ghost" onclick="submitReport('spam')">Spam</button>
        </div>
      `);
    }

    function submitReport(reason) {
      const reports = JSON.parse(localStorage.getItem('gavel_reports') || '[]');
      reports.push({ auctionId: auction.id, sellerEmail: auction.sellerEmail, reason: reason, createdAt: new Date().toISOString() });
      localStorage.setItem('gavel_reports', JSON.stringify(reports));
      UI.closeModal();
      UI.toast('Listing reported', 'info');
    }

    function blockSeller() {
      const blocked = JSON.parse(localStorage.getItem('gavel_blocked_sellers') || '[]');
      if (blocked.indexOf(auction.sellerEmail) === -1) blocked.push(auction.sellerEmail);
      localStorage.setItem('gavel_blocked_sellers', JSON.stringify(blocked));
      UI.toast('Seller blocked from your explore feed', 'info');
    }

    function relativeTime(value) {
      const diff = Date.now() - new Date(value).getTime();
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (minutes < 1) return 'Just now';
      if (minutes < 60) return minutes + ' min ago';
      if (hours < 24) return hours + ' hr ago';
      return days + ' day' + (days === 1 ? '' : 's') + ' ago';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.switchMedia = switchMedia;
    window.openLightbox = openLightbox;
    window.closeLightbox = closeLightbox;
    window.confirmAndPlaceBid = confirmAndPlaceBid;
    window.toggleAutoBidPanel = toggleAutoBidPanel;
    window.confirmAndSetAutoBid = confirmAndSetAutoBid;
    window.cancelAutoBid = cancelAutoBid;
    window.reportListing = reportListing;
    window.blockSeller = blockSeller;
    window.submitReport = submitReport;
  </script>
</body>
</html>
