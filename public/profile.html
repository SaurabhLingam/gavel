<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Gavel</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="images/logo.png">
  <style>
    .profile-page { padding:var(--space-8) 0 var(--space-16); }
    .profile-layout { display:grid; grid-template-columns:320px minmax(0,1fr); gap:var(--space-8); align-items:start; }
    .profile-sidebar, .panel-card, .bid-item, .chart-card { background:var(--bg-raised); border:1px solid var(--border-light); border-radius:var(--radius-2xl); box-shadow:var(--shadow-sm); }
    .profile-sidebar { padding:var(--space-7) var(--space-6); position:sticky; top:calc(var(--space-20) + var(--space-4)); }
    .profile-avatar { width:104px; height:104px; border-radius:50%; background:linear-gradient(135deg,var(--olive),var(--sage)); color:var(--parchment); display:grid; place-items:center; font-family:var(--font-heading); font-size:var(--text-4xl); margin-bottom:var(--space-4); }
    .profile-name { font-family:var(--font-heading); font-size:var(--text-2xl); margin-bottom:6px; }
    .profile-role { font-size:var(--text-xs); color:var(--olive); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; }
    .profile-meta { margin-top:var(--space-5); display:grid; gap:12px; }
    .profile-meta-item strong { display:block; color:var(--text-muted); text-transform:uppercase; font-size:var(--text-xs); letter-spacing:0.05em; margin-bottom:4px; }
    .profile-meta-item span { color:var(--text-primary); }
    .trust-bar-wrap { margin-top:var(--space-5); padding:var(--space-4); background:rgba(143,170,126,0.06); border-radius:var(--radius-xl); border:1px solid rgba(143,170,126,0.15); }
    .trust-bar-label { display:flex; justify-content:space-between; font-size:var(--text-sm); margin-bottom:var(--space-2); }
    .trust-bar { height:8px; background:var(--sand); border-radius:999px; overflow:hidden; }
    .trust-bar-fill { height:100%; background:linear-gradient(90deg,var(--olive),var(--sage)); border-radius:999px; }
    .wallet-mini { margin-top:var(--space-5); padding:var(--space-4); background:var(--sand); border-radius:var(--radius-xl); }
    .wallet-mini-label { font-size:var(--text-xs); color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; }
    .wallet-mini-value { font-family:var(--font-heading); font-size:var(--text-2xl); margin:4px 0 12px; }
    .profile-main { display:grid; gap:var(--space-6); }
    .hero-panel { padding:var(--space-6); }
    .hero-grid { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-4); align-items:start; }
    .hero-title { font-size:clamp(2rem,3vw,3rem); line-height:1.05; margin-bottom:12px; }
    .hero-copy { color:var(--text-secondary); line-height:1.8; max-width:62ch; }
    .badge-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--space-4); margin-top:var(--space-5); }
    .game-badge { padding:var(--space-4); border-radius:20px; background:var(--bg); border:1px solid var(--border-light); }
    .game-badge strong { display:block; font-size:var(--text-xs); letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
    .game-badge span { font-size:var(--text-xl); font-weight:700; }
    .stat-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--space-4); }
    .stat-card { background:var(--bg-raised); border:1px solid var(--border-light); border-radius:var(--radius-xl); padding:var(--space-5); }
    .stat-card-label { font-size:var(--text-xs); color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:var(--space-2); }
    .stat-card-value { font-family:var(--font-heading); font-size:var(--text-2xl); }
    .chart-card { padding:var(--space-6); }
    .chart-shell { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:var(--space-5); align-items:start; }
    .chart-canvas { width:100%; height:260px; background:linear-gradient(180deg,#faf7f2 0%,#f2ecdf 100%); border:1px solid var(--border-light); border-radius:24px; }
    .chart-legend { display:grid; gap:12px; }
    .legend-item { padding:14px 16px; border-radius:18px; background:var(--bg); border:1px solid var(--border-light); }
    .legend-swatch { display:inline-block; width:12px; height:12px; border-radius:999px; margin-right:8px; }
    .section-card { padding:var(--space-6); }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); margin-bottom:var(--space-4); }
    .bid-list { display:grid; gap:var(--space-3); }
    .bid-item { display:flex; align-items:center; justify-content:space-between; padding:var(--space-4) var(--space-5); gap:var(--space-4); }
    .bid-item-left { min-width:0; flex:1; }
    .bid-item-title { font-size:var(--text-sm); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bid-item-title a { color:var(--text-primary); }
    .bid-item-time { font-size:var(--text-xs); color:var(--text-muted); margin-top:3px; }
    .bid-item-amount { font-family:var(--font-heading); font-size:var(--text-lg); white-space:nowrap; }
    @media (max-width: 1080px) {
      .profile-layout, .chart-shell { grid-template-columns:1fr; }
      .profile-sidebar { position:static; }
    }
    @media (max-width: 768px) {
      .badge-grid, .stat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .hero-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body style="padding-top:var(--space-20);">
  <nav class="navbar" id="navbar"><div class="container">
    <a href="/" class="navbar-brand">Gavel<span>.</span></a>
    <ul class="navbar-nav">
      <li><a href="auction.html">Live Auctions</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="sell-product.html">Sell</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="chats.html" class="btn btn-ghost btn-sm">Messages</a>
      <a href="dashboard.html" class="btn btn-primary btn-sm" id="dashboardBtn">Dashboard</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" onclick="Auth.logout()" style="display:none;">Log out</button>
    </div>
  </div></nav>

  <section class="profile-page">
    <div class="container">
      <div id="profileContent"><div class="flex-center" style="padding:2rem;"><div class="spinner"></div></div></div>
    </div>
  </section>

  <footer style="border-top:1px solid var(--border-light);padding:var(--space-8) 0;background:var(--bg);">
    <div class="container flex-between" style="gap:var(--space-4);"><a href="/" class="navbar-brand">Gavel<span>.</span></a><p class="text-muted text-sm">&copy; 2026 Gavel · <a href="/admin-handbook.html">Become an Admin</a></p></div>
  </footer>
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      document.getElementById('logoutBtn').style.display = 'inline-flex';
      window.addEventListener('scroll', () => document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 20));

      const profile = await api.get('/profile');
      if (!profile || profile.error) { UI.toast('Failed to load profile', 'error'); return; }

      const bids = await api.get('/my-bids');
      renderProfile(profile, bids || []);
    });

    function renderProfile(p, bids) {
      const initials = (p.name || p.email || '?').charAt(0).toUpperCase();
      const trust = Number(p.trustScore || 0);
      const trustPct = Math.min(100, Math.max(0, trust));
      const role = p.isSuperAdmin ? 'Super Admin' : p.isAdmin ? 'Admin' : (p.role || 'Bidder');
      const stats = p.stats || {};
      const game = p.gamification || {};
      const completion = Number(game.profileCompleteness || 0);
      const monthlyWon = Array.isArray(game.monthlyWon) ? game.monthlyWon : [];
      const monthlySold = Array.isArray(game.monthlySold) ? game.monthlySold : [];

      let sidebar = `
        <div class="profile-sidebar reveal">
          <div class="profile-avatar">${initials}</div>
          <h2 class="profile-name">${p.name || 'User'}</h2>
          <div class="profile-role">${role}</div>
          ${p.campusVerified ? '<span class="badge badge-approved" style="margin-top:var(--space-2);">Campus Verified</span>' : ''}
          <div class="profile-meta">
            <div class="profile-meta-item"><strong>Email</strong><span>${p.email}</span></div>
            ${p.college ? `<div class="profile-meta-item"><strong>College</strong><span>${p.college}</span></div>` : ''}
            <div class="profile-meta-item"><strong>Joined</strong><span>${p.createdAt ? new Date(p.createdAt).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }) : '—'}</span></div>
          </div>
          <div class="trust-bar-wrap">
            <div class="trust-bar-label"><span>Trust Score</span><span>${trust}/100</span></div>
            <div class="trust-bar"><div class="trust-bar-fill" style="width:${trustPct}%"></div></div>
          </div>
          <div class="wallet-mini">
            <div class="wallet-mini-label">Wallet Balance</div>
            <div class="wallet-mini-value">${UI.formatPrice(p.walletBalance || 0)}</div>
            <button class="btn btn-sm btn-secondary" onclick="addFunds()">Add Funds</button>
          </div>
          <a href="sell-product.html" class="btn btn-primary btn-sm" style="margin-top:var(--space-4);width:100%;">+ New Listing</a>
        </div>`;

      let main = `
        <div class="profile-main">
          <div class="panel-card hero-panel reveal">
            <div class="hero-grid">
              <div>
                <h1 class="hero-title">${p.name || 'Your'} marketplace profile</h1>
                <p class="hero-copy">Track trust, bidding momentum, campus standing, and transaction activity in one place. This page now reflects your live marketplace standing instead of static placeholders.</p>
              </div>
              <a href="dashboard.html" class="btn btn-secondary">Open Dashboard</a>
            </div>
            <div class="badge-grid">
              <div class="game-badge"><strong>Bidding Streak</strong><span>${Number(game.biddingStreak || 0)} days</span></div>
              <div class="game-badge"><strong>Campus Rank</strong><span>#${Number(game.campusRank || 0)}</span></div>
              <div class="game-badge"><strong>Profile Complete</strong><span>${completion}%</span></div>
            </div>
          </div>

          <div class="stat-grid reveal">
            <div class="stat-card"><div class="stat-card-label">Active Listings</div><div class="stat-card-value">${stats.activeListings || 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Pending Review</div><div class="stat-card-value">${stats.pendingListings || 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Closed Listings</div><div class="stat-card-value">${stats.closedListings || 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Active Bids</div><div class="stat-card-value">${stats.activeBids || 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Auctions Won</div><div class="stat-card-value">${stats.auctionsWon || 0}</div></div>
            <div class="stat-card"><div class="stat-card-label">Completed Transactions</div><div class="stat-card-value">${stats.completedTransactions || 0}</div></div>
          </div>

          <div class="chart-card reveal reveal-delay-1">
            <div class="section-head">
              <div>
                <h2 style="font-size:var(--text-2xl);margin-bottom:4px;">Monthly spend / earn trend</h2>
                <p class="text-muted">Won auctions vs sold auctions over the last 6 months.</p>
              </div>
              <a href="watchlist.html" class="btn btn-ghost btn-sm">Watchlist (${stats.watchlistCount || 0})</a>
            </div>
            <div class="chart-shell">
              <canvas id="profileChart" class="chart-canvas"></canvas>
              <div class="chart-legend">
                <div class="legend-item"><span class="legend-swatch" style="background:#5c6b4f;"></span><strong style="display:inline;">Spent Winning</strong><div class="text-muted text-sm" style="margin-top:8px;">${UI.formatPrice(sumSeries(monthlyWon))}</div></div>
                <div class="legend-item"><span class="legend-swatch" style="background:#c45d3e;"></span><strong style="display:inline;">Earned Selling</strong><div class="text-muted text-sm" style="margin-top:8px;">${UI.formatPrice(sumSeries(monthlySold))}</div></div>
                <div class="legend-item"><strong>Trust trajectory</strong><div class="text-muted text-sm" style="margin-top:8px;">Trust starts at 0 for new accounts and improves through completed, well-rated transactions.</div></div>
              </div>
            </div>
          </div>

          <div class="panel-card section-card reveal reveal-delay-1">
            <div class="section-head">
              <h2 style="font-size:var(--text-2xl);">Bid History</h2>
              <a href="auction.html" class="btn btn-ghost btn-sm">Browse Auctions</a>
            </div>
            ${bids.length ? `<div class="bid-list">${bids.map(b => {
              const isOutbid = b.auctionStatus === 'active' && b.amount < b.currentBid;
              const statusBadge = b.auctionStatus === 'closed'
                ? (b.winnerEmail === p.email ? '<span class="badge badge-approved">Won</span>' : '<span class="badge badge-closed">Closed</span>')
                : isOutbid ? '<span class="badge badge-live">Outbid</span>' : '<span class="badge badge-approved">Leading</span>';
              return `<div class="bid-item">
                <div class="bid-item-left">
                  <div class="bid-item-title"><a href="item-detail.html?id=${b.auctionId}">${b.auctionTitle}</a> ${statusBadge}</div>
                  <div class="bid-item-time">${new Date(b.placedAt).toLocaleString('en-IN')}</div>
                </div>
                <div class="bid-item-amount">${UI.formatPrice(b.amount)}</div>
              </div>`;
            }).join('')}</div>` : `<div class="empty-state"><h3>No bids yet</h3><p><a href="auction.html">Browse auctions</a></p></div>`}
          </div>
        </div>`;

      document.getElementById('profileContent').innerHTML = `<div class="profile-layout">${sidebar}${main}</div>`;
      drawProfileChart(monthlyWon, monthlySold);

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
      }, { threshold: 0.1 });
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    function sumSeries(series) {
      return (series || []).reduce((sum, entry) => sum + Number(entry.winningBid || 0), 0);
    }

    function drawProfileChart(monthlyWon, monthlySold) {
      const canvas = document.getElementById('profileChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const ratio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 700;
      const height = 260;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const labels = buildLastSixMonths();
      const wonSeries = buildMonthlySeries(monthlyWon, labels);
      const soldSeries = buildMonthlySeries(monthlySold, labels);
      const max = Math.max(1, ...wonSeries, ...soldSeries);
      const padX = 46;
      const padY = 24;

      ctx.strokeStyle = '#d9ceba';
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i += 1) {
        const y = padY + ((height - padY * 2) / 3) * i;
        ctx.beginPath();
        ctx.moveTo(padX, y);
        ctx.lineTo(width - padX, y);
        ctx.stroke();
      }

      labels.forEach(function(label, index) {
        const x = padX + ((width - padX * 2) / Math.max(labels.length - 1, 1)) * index;
        ctx.fillStyle = '#7a6e5e';
        ctx.font = '12px sans-serif';
        ctx.fillText(label, x - 14, height - 8);
      });

      drawSeries(ctx, wonSeries, width, height, padX, padY, max, '#5c6b4f');
      drawSeries(ctx, soldSeries, width, height, padX, padY, max, '#c45d3e');
    }

    function drawSeries(ctx, series, width, height, padX, padY, max, color) {
      const points = series.map(function(value, index) {
        return {
          x: padX + ((width - padX * 2) / Math.max(series.length - 1, 1)) * index,
          y: padY + (height - padY * 2) - ((value || 0) / max) * (height - padY * 2)
        };
      });
      ctx.beginPath();
      points.forEach(function(point, index) {
        if (!index) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = color;
      points.forEach(function(point) {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function buildLastSixMonths() {
      const labels = [];
      const now = new Date();
      for (let i = 5; i >= 0; i -= 1) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        labels.push(d.toLocaleDateString('en-IN', { month: 'short' }));
      }
      return labels;
    }

    function buildMonthlySeries(entries, labels) {
      const totals = new Map(labels.map(function(label) { return [label, 0]; }));
      (entries || []).forEach(function(entry) {
        const label = new Date(entry.updatedAt || entry.createdAt || Date.now()).toLocaleDateString('en-IN', { month: 'short' });
        totals.set(label, Number(totals.get(label) || 0) + Number(entry.winningBid || 0));
      });
      return labels.map(function(label) { return Number(totals.get(label) || 0); });
    }

    async function addFunds() {
      const amount = prompt('Enter amount to add (₹):', '1000');
      if (!amount) return;
      const num = Number(amount);
      if (!num || num <= 0) { UI.toast('Invalid amount', 'error'); return; }
      const res = await api.post('/deposit', { amount: num });
      if (res?.success) {
        UI.toast(`₹${num.toLocaleString('en-IN')} added!`, 'success');
        document.querySelector('.wallet-mini-value').textContent = UI.formatPrice(res.newBalance);
      } else { UI.toast(res?.error || 'Deposit failed', 'error'); }
    }
  </script>
</body>
</html>
