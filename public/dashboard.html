<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Gavel</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard-home.css">
  <link rel="icon" href="images/logo.png">
  <style>
    .dashboard-shell {
      padding: var(--space-8) 0 var(--space-16);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-4);
    }
    .stat-card {
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      transition: all var(--transition-slow);
    }
    .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .stat-card-label { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-2); }
    .stat-card-value { font-family: var(--font-heading); font-size: var(--text-2xl); color: var(--ink); }
    .stat-card-value.text-olive { color: var(--olive); }
    .stat-card-value.text-ember { color: var(--ember); }
    .stat-card-value.text-gold { color: var(--gold); }

    .dash-section { margin-top: var(--space-12); }
    .dash-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); }
    .dash-section-header h2 { font-size: var(--text-2xl); margin: 0; }
    .dash-section-header a { font-size: var(--text-sm); font-weight: 600; }

    .notif-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .notif-item {
      display: flex; gap: var(--space-4); align-items: flex-start;
      padding: var(--space-4); border-radius: var(--radius-lg);
      background: var(--bg-raised); border: 1px solid var(--border-light);
      transition: all var(--transition);
    }
    .notif-item.unread { border-left: 3px solid var(--olive); background: rgba(143,170,126,0.04); }
    .notif-item:hover { box-shadow: var(--shadow-sm); }
    .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--olive); margin-top: 6px; flex-shrink: 0; }
    .notif-item:not(.unread) .notif-dot { background: var(--stone); }
    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .notif-msg { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5; }
    .notif-time { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-1); }

    .bid-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg);
      background: var(--bg-raised); border: 1px solid var(--border-light);
      gap: var(--space-4);
    }
    .bid-item-left { min-width: 0; flex: 1; }
    .bid-item-title { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bid-item-time { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
    .bid-item-amount { font-family: var(--font-heading); font-size: var(--text-lg); color: var(--ink); white-space: nowrap; }

    .listing-item {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-4); border-radius: var(--radius-lg);
      background: var(--bg-raised); border: 1px solid var(--border-light);
    }
    .listing-item img { width: 56px; height: 56px; border-radius: var(--radius-md); object-fit: cover; background: var(--sand); }
    .listing-item-body { flex: 1; min-width: 0; }
    .listing-item-title { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .listing-item-meta { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }

    .admin-panel {
      background: rgba(143,170,126,0.06);
      border: 1px solid rgba(143,170,126,0.15);
      border-radius: var(--radius-2xl);
      padding: var(--space-6);
      margin-top: var(--space-8);
    }
    .admin-panel h3 { font-size: var(--text-xl); color: var(--olive); margin-bottom: var(--space-4); }
    .admin-link {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
      font-size: var(--text-sm); font-weight: 600; color: var(--olive);
      background: rgba(92,107,79,0.08); transition: all var(--transition);
      text-decoration: none; margin-right: var(--space-3); margin-bottom: var(--space-3);
    }
    .admin-link:hover { background: var(--olive); color: var(--parchment); }

    .wallet-card {
      background: linear-gradient(135deg, var(--forest) 0%, var(--olive-dark) 100%);
      border-radius: var(--radius-2xl);
      padding: var(--space-6);
      color: var(--parchment);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: var(--space-4);
    }
    .wallet-label { font-size: var(--text-sm); opacity: 0.8; margin-bottom: var(--space-1); }
    .wallet-balance { font-family: var(--font-heading); font-size: var(--text-3xl); }
    .wallet-actions { display: flex; gap: var(--space-3); }
    .wallet-actions .btn { background: rgba(255,255,255,0.15); color: var(--parchment); border: 1px solid rgba(255,255,255,0.2); }
    .wallet-actions .btn:hover { background: rgba(255,255,255,0.25); }
    .wallet-note {
      margin-top: var(--space-4);
      padding: var(--space-4);
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: var(--text-sm);
      line-height: 1.7;
      color: rgba(250,247,242,0.86);
      max-width: 560px;
    }
    .wallet-history {
      display: grid;
      gap: var(--space-4);
    }
    .wallet-history-empty {
      padding: var(--space-5);
      border-radius: var(--radius-xl);
      border: 1px dashed var(--border-light);
      color: var(--text-secondary);
      background: var(--bg-raised);
    }
    .wallet-tx {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-5);
      border-radius: var(--radius-lg);
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
    }
    .wallet-tx-main {
      min-width: 0;
      flex: 1;
    }
    .wallet-tx-title {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .wallet-tx-details {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .wallet-tx-meta {
      margin-top: 6px;
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
    .wallet-tx-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
      text-align: right;
    }
    .wallet-tx-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .wallet-tx-badge.credit { background: rgba(92,107,79,0.12); color: var(--olive); }
    .wallet-tx-badge.debit { background: rgba(224,107,72,0.12); color: var(--ember); }
    .wallet-tx-badge.info { background: rgba(116,116,116,0.12); color: var(--text-secondary); }
    .wallet-tx-amount {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      color: var(--ink);
      white-space: nowrap;
    }

    .dashboard-stack {
      display: grid;
      gap: var(--space-8);
    }
    .dashboard-panel {
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-sm);
      padding: var(--space-6);
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
    }
    .dashboard-note {
      margin-top: var(--space-4);
      padding: var(--space-4);
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: var(--text-sm);
      line-height: 1.7;
      color: rgba(250,247,242,0.86);
      max-width: 560px;
    }

    @media (max-width: 768px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
      .dashboard-shell { padding-top: var(--space-6); }
    }
  </style>
</head>
<body style="padding-top:var(--space-20);">
  <nav class="navbar" id="navbar"><div class="container">
    <a href="/" class="navbar-brand">Gavel<span>.</span></a>
    <ul class="navbar-nav">
      <li><a href="auction.html">Live Auctions</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="sell-product.html">Sell</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="profile.html" class="btn btn-ghost btn-sm" id="profileBtn">Profile</a>
      <a href="dashboard.html" class="btn btn-primary btn-sm" id="dashboardBtn">Dashboard</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" onclick="Auth.logout()" style="display:none;">Log out</button>
    </div>
  </div></nav>

  <section class="greeting-hero">
    <div class="container">
      <div class="greeting-hero-inner">
        <div class="greeting-left">
          <h1 id="greetingText">Loading your dashboard...</h1>
          <div class="campus-badge hide" id="campusBadge"></div>
          <p class="greeting-subline" id="watchlistSubline">Track bids, wallet balance, and handoffs from one place.</p>
        </div>
        <div class="greeting-right">
          <div class="stat-pill" id="walletPill">
            <div class="stat-pill-label">₹ Wallet</div>
            <div class="stat-pill-value">₹0</div>
          </div>
          <div class="stat-pill" id="activeBidsPill">
            <div class="stat-pill-label">Active Bids</div>
            <div class="stat-pill-value">0</div>
          </div>
          <div class="stat-pill" id="itemsSoldPill">
            <div class="stat-pill-label">Items Sold</div>
            <div class="stat-pill-value">0</div>
          </div>
          <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn btn-primary topup-trigger" onclick="addFunds()">Top Up Wallet</button>
            <button class="btn btn-secondary topup-trigger" onclick="withdrawFunds()">Withdraw</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="admin-banner hide" id="adminBanner">
    <div class="container">
      <a href="admin-dashboard.html">Admin workspace →</a>
    </div>
  </div>

  <section class="dashboard-shell">
    <div class="container">
      <div id="dashContent"><div class="flex-center" style="padding:2rem;"><div class="spinner"></div></div></div>
    </div>
  </section>

  <footer style="border-top:1px solid var(--border-light);padding:var(--space-8) 0;background:var(--bg);">
    <div class="container flex-between" style="gap:var(--space-4);"><a href="/" class="navbar-brand">Gavel<span>.</span></a><p class="text-muted text-sm">&copy; 2026 Gavel</p></div>
  </footer>
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/site.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    let data = null;
    let dashboardCollections = {
      bids: [],
      endingSoon: [],
      recommended: []
    };
    let walletAutoRefreshTimer = null;
    let activeWalletPollOrderId = '';
    let dashboardRendered = false;

    function delay(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    async function refreshDashboardSummary(options = {}) {
      const [summary, bids, endingSoon, recommended] = await Promise.all([
        api.get(`/dashboard/summary?ts=${Date.now()}`),
        api.get(`/my-bids?ts=${Date.now()}`),
        api.get('/auctions?sort=endingSoon&limit=6&lightweight=1&ts=' + Date.now()),
        api.get('/recommendations/for-you?ts=' + Date.now())
      ]);
      if (!summary || summary.error) {
        if (!options.silent) UI.toast(summary?.error || 'Failed to refresh wallet state.', 'error');
        return null;
      }
      data = summary;
      dashboardCollections = {
        bids: Array.isArray(bids) ? bids : [],
        endingSoon: Array.isArray(endingSoon) ? endingSoon : [],
        recommended: Array.isArray(recommended) ? recommended : []
      };
      renderDashboard();
      return summary;
    }

    function startWalletAutoRefresh() {
      if (walletAutoRefreshTimer) window.clearInterval(walletAutoRefreshTimer);
      walletAutoRefreshTimer = window.setInterval(() => {
        if (document.visibilityState === 'visible') {
          refreshDashboardSummary({ silent: true });
        }
      }, 60000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          refreshDashboardSummary({ silent: true });
        }
      });
    }

    async function pollWalletOrderStatus(orderId, amount) {
      if (!orderId) return false;
      activeWalletPollOrderId = orderId;
      for (let attempt = 0; attempt < 24; attempt += 1) {
        if (activeWalletPollOrderId !== orderId) return false;
        const status = await api.get(`/payments/razorpay/status/${encodeURIComponent(orderId)}?ts=${Date.now()}`);
        if (activeWalletPollOrderId !== orderId) return false;
        if (status?.status === 'paid' || status?.success) {
          activeWalletPollOrderId = '';
          UI.closeModal();
          await refreshDashboardSummary({ silent: true });
          UI.toast(`Wallet credited with ${UI.formatPrice(amount)}.`, 'success');
          return true;
        }
        if (status?.status === 'failed') {
          activeWalletPollOrderId = '';
          UI.toast(status?.error || 'Razorpay payment did not complete.', 'error');
          return false;
        }
        await delay(3500);
      }
      if (activeWalletPollOrderId === orderId) {
        activeWalletPollOrderId = '';
        UI.toast('Payment is still pending. Your wallet will refresh automatically once Razorpay confirms it.', 'info');
      }
      return false;
    }

    function attachLogoBehavior() {
      const logos = document.querySelectorAll('.navbar-brand');
      const user = Auth.getUser();
      logos.forEach(logo => {
        // Update href for right-click/open in new tab
        logo.href = user ? '/dashboard.html' : '/';
        logo.addEventListener('click', (e) => {
          e.preventDefault();
          if (user) {
            window.location.href = '/dashboard.html';
          } else {
            window.location.href = '/';
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      attachLogoBehavior();
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }

      window.addEventListener('scroll', () => document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 20));
      document.getElementById('logoutBtn').style.display = 'inline-flex';
      const user = Auth.getUser();
      if (user?.isAdmin || user?.isSuperAdmin) {
        document.getElementById('adminBanner')?.classList.remove('hide');
      }

      const res = await refreshDashboardSummary();
      if (!res) return;
      startWalletAutoRefresh();
    });

    function renderDashboard() {
      const u = data.user;
      const s = data.stats;
      const root = document.getElementById('dashContent');
      if (!root) return;

      updateGreeting(u);
      updateStats(u);
      updateCampusBadge(u);
      updateWatchlistSubline(data.watchlist || []);

      if (!dashboardRendered) {
        root.innerHTML = `
          <div id="dashboardSections">
            ${renderActivitySection(true)}
            ${renderEndingSoonSection(true)}
            ${renderRecommendedSection(true)}
            ${renderRecentlyViewedSection(true)}
            <section id="walletSection" class="section reveal reveal-delay-1">
              <div class="two-col">
                <div id="walletCardSection" class="dashboard-panel">${renderWalletCard(u, s)}</div>
                <div id="walletHistorySection" class="dashboard-panel">${renderWalletHistorySection(data.walletHistory || [])}</div>
              </div>
            </section>
            <section id="statsSection" class="section reveal reveal-delay-2">
              <div class="dashboard-panel">
                <div class="dash-section-header" style="margin-bottom:var(--space-4);">
                  <div>
                    <h2 style="margin:0;">Your Snapshot</h2>
                    <p class="text-muted text-sm">Activity, listings, and account summary</p>
                  </div>
                </div>
                <div class="stat-grid">${renderStats(u, s)}</div>
              </div>
            </section>
            ${u.isAdmin || u.isSuperAdmin ? `<section id="adminWorkspaceSection" class="section reveal reveal-delay-2"><div class="dashboard-panel">${renderAdminWorkspaceSection(u)}</div></section>` : ''}
            ${renderListingsSection(true)}
            ${renderRecentBidsSection(true)}
            ${renderNotificationsSection(true)}
          </div>`;
        dashboardRendered = true;
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        return;
      }

      updateDashboardInPlace();
    }

    function renderActivitySection(animate = true) {
      const items = (dashboardCollections.bids || [])
        .filter((bid) => bid.auctionStatus === 'active' || bid.auctionStatus === 'closed')
        .slice(0, 4);
      const empty = !items.length ? '<div class="empty-state" style="grid-column:1/-1;"><h3>No activity yet</h3><p>Browse auctions to get started</p><a href="explore.html" class="btn btn-primary">Browse Auctions →</a></div>' : '';
      const cards = items.map((item) => {
        const isClosed = item.auctionStatus === 'closed';
        const isWinningClosed = isClosed && item.winnerEmail === data?.user?.email;
        const statusClass = isWinningClosed || !isClosed ? 'winning' : 'outbid';
        const label = isWinningClosed ? 'Won' : isClosed ? 'Closed' : 'Live';
        const meta = isWinningClosed
          ? 'You won this auction. Open the receipt or continue the handoff.'
          : isClosed
            ? 'This auction closed. Open the item to review the result.'
            : `Last bid: ${new Date(item.placedAt).toLocaleString('en-IN')}`;
        const actionText = isWinningClosed ? 'Continue handoff' : 'Open item';
        const href = isWinningClosed ? `/winner-confirmation.html?id=${item.auctionId}` : `/item-detail.html?id=${item.auctionId}`;
        return `
          <div class="activity-card ${statusClass}">
            <span class="activity-label">${label}</span>
            <div class="activity-card-title">${escapeHtml(item.auctionTitle || 'Auction')}</div>
            <div class="activity-card-price">${UI.formatPrice(item.amount || item.currentBid || 0)}</div>
            <div class="activity-meta">${meta}</div>
            <a class="btn btn-sm ${statusClass === 'outbid' ? 'btn-secondary' : 'btn-primary'}" href="${href}" style="width:fit-content;">${actionText}</a>
          </div>
        `;
      }).join('');
      return `<section id="activitySection" class="section ${animate ? 'reveal' : ''}">
        <div class="section-header">
          <div>
            <h2>Your Activity</h2>
            <p>Only the bids and listings that still need your attention.</p>
          </div>
          <a href="explore.html" class="btn btn-ghost btn-sm">Browse Auctions</a>
        </div>
        <div class="activity-strip" id="activityStrip">${cards || ''}${empty}</div>
        <div class="empty-state hide" id="activityEmpty">
          <h3>No activity yet</h3>
          <p>Browse auctions to get started</p>
          <a href="explore.html" class="btn btn-primary">Browse Auctions →</a>
        </div>
      </section>`;
    }

    function renderEndingSoonSection(animate = true) {
      const auctions = dashboardCollections.endingSoon || [];
      if (!auctions.length) {
        return `<section id="endingSoonSection" class="section ${animate ? 'reveal reveal-delay-1' : ''}">
          <div class="section-header"><div><h2>Ending Soon</h2><p>The live auctions closing first across Gavel.</p></div></div>
          <div class="ending-soon-strip" id="endingSoonStrip"><div class="empty-state" style="grid-column:1/-1;"><h3>No live auctions yet</h3><p>Ending-soon items will appear here automatically.</p></div></div>
        </section>`;
      }
      return `<section id="endingSoonSection" class="section ${animate ? 'reveal reveal-delay-1' : ''}">
        <div class="section-header">
          <div><h2>Ending Soon</h2><p>The live auctions closing first across Gavel.</p></div>
          <a href="auction.html" class="btn btn-ghost btn-sm">Open live auctions</a>
        </div>
        <div class="ending-soon-strip" id="endingSoonStrip">${auctions.slice(0, 4).map((auction) => UI.renderAuctionCard(auction)).join('')}</div>
      </section>`;
    }

    function renderRecommendedSection(animate = true) {
      const auctions = dashboardCollections.recommended || [];
      if (!auctions.length) {
        return `<section id="recommendedSection" class="section ${animate ? 'reveal reveal-delay-2' : ''}">
          <div class="section-header"><div><h2 class="font-heading">Picked for you</h2><p>Fresh listings matched from your browsing and bidding patterns.</p></div></div>
          <div class="recommended-grid" id="recommendedGrid"><div class="empty-state" style="grid-column:1/-1;"><h3>No recommendations yet</h3><p>Browse explore to build your feed.</p></div></div>
        </section>`;
      }
      return `<section id="recommendedSection" class="section ${animate ? 'reveal reveal-delay-2' : ''}">
        <div class="section-header">
          <div><h2 class="font-heading">Picked for you</h2><p>Fresh listings matched from your browsing and bidding patterns.</p></div>
          <a href="explore.html" class="btn btn-ghost btn-sm">Explore</a>
        </div>
        <div class="recommended-grid" id="recommendedGrid">${auctions.slice(0, 8).map((auction) => UI.renderAuctionCard(auction)).join('')}</div>
      </section>`;
    }

    function renderRecentlyViewedSection(animate = true) {
      const recent = JSON.parse(localStorage.getItem('gavel_recently_viewed') || '[]').slice(0, 4);
      if (!recent.length) return '';
      return `<section id="recentlyViewedSection" class="section ${animate ? 'reveal reveal-delay-2' : ''}">
        <div class="section-header">
          <div><h2>Recently Viewed</h2><p>Quick return to products you opened recently.</p></div>
        </div>
        <div class="recently-viewed-strip" id="recentlyViewedStrip">${recent.map((item) => `
          <a href="/item-detail.html?id=${item.id}" class="recently-viewed-card" style="text-decoration:none;">
            <div class="recently-viewed-media" style="${item.image ? `background-image:url('${item.image}')` : ''}"></div>
            <div class="activity-card-title">${escapeHtml(item.name || 'Listing')}</div>
            <div class="activity-meta">Last seen bid ${UI.formatPrice(item.bid || 0)}</div>
            <span class="btn btn-ghost btn-sm" style="width:fit-content;">Open again</span>
          </a>
        `).join('')}</div>
      </section>`;
    }

    function isVisibleListing(item) {
      const status = String(item?.status || '').toLowerCase();
      if (['closed', 'cancelled', 'rejected', 'draft'].includes(status)) return false;
      if (status === 'active' && item.endTime && new Date(item.endTime).getTime() <= Date.now()) return false;
      return true;
    }

    function renderWalletCard(u, s) {
      return `<div class="wallet-card">
        <div>
          <div class="wallet-label">Wallet Balance</div>
          <div class="wallet-balance">${UI.formatPrice(u.walletBalance || 0)}</div>
          <div class="wallet-note">Top-ups and withdrawals are real wallet movements. Reserve commitments for auctions you are currently bidding on are not spent yet, but they reduce what you can withdraw. Available to withdraw: <span id="availableToWithdrawValue">${UI.formatPrice((u.availableToWithdraw ?? s.availableToWithdraw) || 0)}</span>. Active commitments: <span id="committedBidBalanceValue">${UI.formatPrice((u.committedBidBalance ?? s.committedBidBalance) || 0)}</span>.</div>
        </div>
        <div class="wallet-actions">
          <button class="btn btn-sm" onclick="addFunds()">Add Funds</button>
          <button class="btn btn-sm" onclick="withdrawFunds()">Withdraw</button>
        </div>
      </div>`;
    }

    function renderWalletHistorySection(items) {
      return `<div class="dash-section-header" style="margin-bottom:var(--space-4);">
        <h2>Transaction History</h2>
        <p class="text-muted text-sm">Credits, debits, and escrow changes</p>
      </div>
      <div id="walletHistoryList">${renderWalletHistory(items)}</div>`;
    }

    function renderStats(u, s) {
      let html = '';
      html += statCard('Active Listings', s.activeListings, 'text-olive');
      html += statCard('Pending Review', s.pendingListings, 'text-gold');
      html += statCard('Sold', s.soldListings, 'text-olive');
      html += statCard('Active Bids', s.activeBids, 'text-olive');
      html += statCard('Auctions Won', s.won, 'text-olive');
      html += statCard('Watchlist', s.watchlistCount, '');
      if (u.isAdmin || u.isSuperAdmin) {
        html += statCard('Total Users', s.totalUsers, 'text-gold');
        html += statCard('Total Auctions', s.totalAuctions, 'text-gold');
      }
      return html;
    }

    function renderAdminWorkspaceSection(u) {
      let html = '<h3>Admin Workspace</h3><div>';
      if (data.adminWorkspace) html += `<span class="badge badge-pending" style="margin-right:var(--space-3);">${data.adminWorkspace.assignedReviews} assigned review${data.adminWorkspace.assignedReviews !== 1 ? 's' : ''}</span>`;
      html += `<a href="admin-dashboard.html" class="admin-link">Admin Dashboard</a>
        <a href="admin-dashboard.html#pending" class="admin-link">Review Queue</a>`;
      if (u.isSuperAdmin) html += `<a href="admin-dashboard.html#wallet-deposits" class="admin-link">Wallet Deposits</a><a href="admin-dashboard.html#team" class="admin-link">Team Overview</a>`;
      html += `</div>`;
      return html;
    }

    function renderListingsSection(animate = true) {
      const visibleListings = (data.listings || []).filter(isVisibleListing).slice(0, 5);
      if (!visibleListings.length) return '';
      let html = `<div id="listingsSection" class="dash-section ${animate ? 'reveal reveal-delay-2' : ''}">
        <div class="dash-section-header"><h2>My Listings</h2><a href="my-products.html">View all</a></div>
        <div style="display:flex;flex-direction:column;gap:var(--space-3);">`;
      visibleListings.forEach((l) => {
        const img = (l.images || [])[0] || '';
        const statusBadge = l.status === 'active' ? '<span class="badge badge-live">Live</span>' :
          l.status === 'pending_review' || l.status === 'under_review' ? '<span class="badge badge-pending">Pending</span>' :
          l.status === 'rejected' ? '<span class="badge badge-closed">Rejected</span>' :
          '<span class="badge badge-closed">Closed</span>';
        html += `<div class="listing-item">
          ${img ? `<img src="${img}" alt="${l.title}" onerror="this.style.display='none'">` : '<div style="width:56px;height:56px;border-radius:var(--radius-md);background:var(--sand);"></div>'}
          <div class="listing-item-body">
            <div class="listing-item-title">${l.title} ${statusBadge}</div>
            <div class="listing-item-meta">${UI.formatPrice(l.currentBid)} · ${l.category || 'General'}</div>
          </div>
          <a href="item-detail.html?id=${l.id}" class="btn btn-ghost btn-sm">View</a>
        </div>`;
      });
      html += `</div></div>`;
      return html;
    }

    function renderRecentBidsSection(animate = true) {
      const recent = (data.recentBids || []).slice(0, 5);
      if (!recent.length) return '';
      let html = `<div id="recentBidsSection" class="dash-section ${animate ? 'reveal reveal-delay-2' : ''}">
        <div class="dash-section-header"><h2>Recent Bids</h2></div>
        <div style="display:flex;flex-direction:column;gap:var(--space-3);">`;
      recent.forEach((b) => {
        html += `<div class="bid-item">
          <div class="bid-item-left">
            <div class="bid-item-title"><a href="item-detail.html?id=${b.auctionId}" style="color:var(--text-primary);">${b.title}</a></div>
            <div class="bid-item-time">${UI.formatTimeShort(b.placedAt)}</div>
          </div>
          <div class="bid-item-amount">${UI.formatPrice(b.amount)}</div>
        </div>`;
      });
      html += `</div></div>`;
      return html;
    }

    function renderNotificationsSection(animate = true) {
      const notes = data.notifications || [];
      if (!notes.length) return '';
      let html = `<div id="notificationsSection" class="dash-section ${animate ? 'reveal reveal-delay-2' : ''}">
        <div class="dash-section-header"><h2>Notifications</h2><button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all read</button></div>
        <div class="notif-list">`;
      notes.slice(0, 8).forEach((n) => {
        html += `<div class="notif-item ${n.read ? '' : 'unread'}">
          <div class="notif-dot"></div>
          <div class="notif-body">
            <div class="notif-title">${n.title || 'Notification'}</div>
            <div class="notif-msg">${n.message || ''}</div>
            ${n.actionUrl ? `<a href="${n.actionUrl}" style="font-size:var(--text-xs);color:var(--olive);font-weight:600;">View details</a>` : ''}
            <div class="notif-time">${n.createdAt ? UI.formatTimeShort(n.createdAt) : ''}</div>
          </div>
        </div>`;
      });
      html += `</div></div>`;
      return html;
    }

    function updateDashboardInPlace() {
      const u = data.user;
      const s = data.stats;
      updateGreeting(u);
      updateStats(u);
      updateCampusBadge(u);
      updateWatchlistSubline(data.watchlist || []);
      const activitySection = document.getElementById('activitySection');
      const endingSoonSection = document.getElementById('endingSoonSection');
      const recommendedSection = document.getElementById('recommendedSection');
      const recentlyViewedSection = document.getElementById('recentlyViewedSection');
      const walletCard = document.getElementById('walletCardSection');
      const walletHistory = document.getElementById('walletHistoryList');
      const statsSection = document.getElementById('statsSection');
      const adminSection = document.getElementById('adminWorkspaceSection');
      const listingsSection = document.getElementById('listingsSection');
      const bidsSection = document.getElementById('recentBidsSection');
      const notificationsSection = document.getElementById('notificationsSection');

      const walletBalanceEl = walletCard?.querySelector('.wallet-balance');
      if (walletBalanceEl) walletBalanceEl.textContent = UI.formatPrice(u.walletBalance || 0);
      const availableEl = document.getElementById('availableToWithdrawValue');
      if (availableEl) availableEl.textContent = UI.formatPrice((u.availableToWithdraw ?? s.availableToWithdraw) || 0);
      const committedEl = document.getElementById('committedBidBalanceValue');
      if (committedEl) committedEl.textContent = UI.formatPrice((u.committedBidBalance ?? s.committedBidBalance) || 0);

      syncSection('activitySection', renderActivitySection(false), activitySection);
      syncSection('endingSoonSection', renderEndingSoonSection(false), endingSoonSection);
      syncSection('recommendedSection', renderRecommendedSection(false), recommendedSection);
      syncSection('recentlyViewedSection', renderRecentlyViewedSection(false), recentlyViewedSection);
      if (walletHistory) walletHistory.innerHTML = renderWalletHistory(data.walletHistory || []);
      const statsGrid = statsSection?.querySelector('.stat-grid');
      if (statsGrid) statsGrid.innerHTML = renderStats(u, s);
      if (adminSection && (u.isAdmin || u.isSuperAdmin)) adminSection.innerHTML = renderAdminWorkspaceSection(u);
      syncSection('listingsSection', renderListingsSection(false), listingsSection);
      syncSection('recentBidsSection', renderRecentBidsSection(false), bidsSection);
      syncSection('notificationsSection', renderNotificationsSection(false), notificationsSection);
    }

    function syncSection(id, html, existingNode = null) {
      const current = existingNode || document.getElementById(id);
      const host = document.getElementById('dashboardSections');
      if (html) {
        if (current) current.outerHTML = html;
        else host?.insertAdjacentHTML('beforeend', html);
      } else if (current) {
        current.remove();
      }
    }

    function updateGreeting(currentUser) {
      const hour = new Date().getHours();
      let greeting = 'Good evening';
      if (hour < 12) greeting = 'Good morning';
      else if (hour < 17) greeting = 'Good afternoon';
      const name = currentUser?.name ? currentUser.name.split(' ')[0] : (currentUser?.email || 'there').split('@')[0];
      const el = document.getElementById('greetingText');
      if (el) el.textContent = `${greeting}, ${name}`;
    }

    function updateStats(summaryUser) {
      const stats = data?.stats || {};
      const walletEl = document.getElementById('walletPill');
      const activeBidsEl = document.getElementById('activeBidsPill');
      const itemsSoldEl = document.getElementById('itemsSoldPill');
      if (walletEl) {
        const valueEl = walletEl.querySelector('.stat-pill-value');
        if (valueEl) valueEl.textContent = UI.formatPrice(summaryUser?.walletBalance || 0);
        walletEl.title = `Available to withdraw: ${UI.formatPrice(summaryUser?.availableToWithdraw || 0)} · Active commitments: ${UI.formatPrice(summaryUser?.committedBidBalance || 0)}`;
      }
      if (activeBidsEl) {
        const valueEl = activeBidsEl.querySelector('.stat-pill-value');
        if (valueEl) valueEl.textContent = stats.activeBids || 0;
      }
      if (itemsSoldEl) {
        const valueEl = itemsSoldEl.querySelector('.stat-pill-value');
        if (valueEl) valueEl.textContent = stats.soldListings || stats.closedListings || 0;
      }
    }

    function updateCampusBadge(summaryUser) {
      const badge = document.getElementById('campusBadge');
      if (!badge) return;
      const college = String(summaryUser?.college || '').trim();
      if (!college) {
        badge.classList.add('hide');
        badge.textContent = '';
        return;
      }
      badge.textContent = college;
      badge.classList.remove('hide');
    }

    function updateWatchlistSubline(watchlist) {
      const subline = document.getElementById('watchlistSubline');
      if (!subline) return;
      const count = Array.isArray(watchlist) ? watchlist.length : 0;
      if (!count) {
        subline.textContent = 'No watched auctions yet. Explore listings and save the ones you want to track.';
        return;
      }
      subline.textContent = `${count} watched auction${count !== 1 ? 's' : ''} ready for quick follow-up.`;
    }

    function statCard(label, value, colorClass) {
      return `<div class="stat-card"><div class="stat-card-label">${label}</div><div class="stat-card-value ${colorClass}">${value !== undefined ? value : '—'}</div></div>`;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderWalletHistory(items) {
      if (!items || !items.length) {
        return `<div class="wallet-history-empty">No wallet activity yet. Your top-ups, withdrawals, and escrow changes will show up here.</div>`;
      }

      return `<div class="wallet-history">${items.map((tx) => {
        const amount = Number(tx.amount || 0);
        const amountLabel = tx.direction === 'debit'
          ? `-${UI.formatPrice(amount)}`
          : tx.direction === 'credit'
            ? `+${UI.formatPrice(amount)}`
            : UI.formatPrice(amount);
        const badgeClass = tx.direction || 'info';
        const balanceLine = Number.isFinite(Number(tx.balanceAfter))
          ? `<div class="wallet-tx-meta">Balance after: ${UI.formatPrice(tx.balanceAfter)}</div>`
          : '';
        const metaBits = [
          tx.auctionTitle ? `Auction: ${tx.auctionTitle}` : '',
          tx.counterpartyName ? `Counterparty: ${tx.counterpartyName}` : '',
          tx.createdAt ? UI.formatTimeShort(tx.createdAt) : ''
        ].filter(Boolean);

        return `<article class="wallet-tx">
          <div class="wallet-tx-main">
            <div class="wallet-tx-title">${escapeHtml(tx.title || 'Wallet activity')}</div>
            <div class="wallet-tx-details">${escapeHtml(tx.details || '')}</div>
            <div class="wallet-tx-meta">${escapeHtml(metaBits.join(' · '))}</div>
            ${balanceLine}
          </div>
          <div class="wallet-tx-side">
            <span class="wallet-tx-badge ${badgeClass}">${tx.direction || 'info'}</span>
            <div class="wallet-tx-amount">${amountLabel}</div>
          </div>
        </article>`;
      }).join('')}</div>`;
    }

    async function addFunds() {
      UI.showModal(`
        <h3>Top up your wallet</h3>
        <p style="margin-top:var(--space-3);color:var(--text-secondary);">You will be sent through Razorpay checkout. As soon as Razorpay confirms the payment, the same amount is credited to your wallet.</p>
        <div class="form-group" style="margin-top:var(--space-4);">
          <label class="form-label">Amount</label>
          <input id="walletTopupAmount" class="form-input" type="number" min="100" step="100" value="1000">
          <p class="text-muted text-sm" style="margin-top:var(--space-2);">Minimum top-up is ₹100. The wallet view refreshes automatically after payment confirmation.</p>
        </div>
        <div style="display:flex;gap:var(--space-3);margin-top:var(--space-5);">
          <button class="btn btn-ghost" onclick="UI.closeModal()" style="flex:1;">Cancel</button>
          <button class="btn btn-primary" onclick="startWalletTopup()" style="flex:1;">Continue</button>
        </div>
      `);
    }

    async function startWalletTopup() {
      const num = Number(document.getElementById('walletTopupAmount')?.value || 0);
      if (!Number.isFinite(num) || num < 100) {
        UI.toast('Enter a valid amount of at least ₹100.', 'error');
        return;
      }
      const orderResponse = await api.post('/payments/razorpay/order', { amount: num });
      if (!orderResponse?.order?.id) {
        if (orderResponse?.paymentLink) {
          window.location.href = orderResponse.paymentLink;
          return;
        }
        UI.toast(orderResponse?.error || 'Wallet top-up failed.', 'error');
        return;
      }
      if (typeof window.Razorpay !== 'function') {
        UI.toast('Razorpay checkout is not available right now.', 'error');
        return;
      }

      const orderId = orderResponse.order.id;
      void pollWalletOrderStatus(orderId, num);

      const checkout = new window.Razorpay({
        key: orderResponse.keyId,
        order_id: orderId,
        amount: orderResponse.order.amount,
        currency: orderResponse.order.currency || 'INR',
        name: 'Gavel',
        description: `Wallet top-up of ${UI.formatPrice(num)}`,
        notes: orderResponse.order.notes || {},
        handler: async (response) => {
          const verified = await api.post('/payments/razorpay/verify', response);
          if (verified?.success) {
            activeWalletPollOrderId = '';
            UI.closeModal();
            await refreshDashboardSummary({ silent: true });
            UI.toast(`Wallet credited with ${UI.formatPrice(num)}.`, 'success');
            return;
          }
          UI.toast(verified?.error || 'Payment received. Waiting for Razorpay confirmation.', 'info');
        },
        modal: {
          ondismiss: () => {
            UI.toast('Checking payment status for the latest wallet top-up.', 'info');
          }
        },
        theme: { color: '#365314' }
      });

      checkout.open();
    }

    async function withdrawFunds() {
      const availableAmount = Number(data?.user?.availableToWithdraw ?? data?.stats?.availableToWithdraw ?? 0);
      UI.showModal(`
        <h3>Withdraw from wallet</h3>
        <p style="margin-top:var(--space-3);color:var(--text-secondary);">You can only withdraw the amount not reserved for active auctions you are participating in.</p>
        <div class="form-group" style="margin-top:var(--space-4);">
          <label class="form-label">Amount</label>
          <input id="walletWithdrawAmount" class="form-input" type="number" min="1" step="1" value="${Math.max(0, Math.min(availableAmount || 1000, 1000))}">
          <p class="text-muted text-sm" style="margin-top:var(--space-2);">Available to withdraw right now: ${UI.formatPrice(availableAmount)}.</p>
        </div>
        <div style="display:flex;gap:var(--space-3);margin-top:var(--space-5);">
          <button class="btn btn-ghost" onclick="UI.closeModal()" style="flex:1;">Cancel</button>
          <button class="btn btn-primary" onclick="submitWithdraw()" style="flex:1;">Withdraw</button>
        </div>
      `);
    }

    async function submitWithdraw() {
      const num = Number(document.getElementById('walletWithdrawAmount')?.value || 0);
      if (!Number.isFinite(num) || num < 1) {
        UI.toast('Enter a valid amount.', 'error');
        return;
      }
      const withdraw = await api.post('/wallet/withdraw', { amount: num });
      if (!withdraw?.success) {
        UI.toast(withdraw?.error || 'Withdrawal failed.', 'error');
        return;
      }
      UI.closeModal();
      await refreshDashboardSummary({ silent: true });
      UI.toast(`Withdrawal completed for ${UI.formatPrice(num)}.`, 'success');
    }

    async function markAllRead() {
      const res = await api.post('/notifications/read', {});
      if (res?.success) {
        document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
        UI.toast('All notifications marked as read', 'success');
      }
    }
  </script>
</body>
</html>
